<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111827;color:#fff;font-family:"Microsoft JhengHei",system-ui,sans-serif}button{font:inherit}#app{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#263853,#111827 70%)}#shell{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:#0b1220;overflow:hidden;box-shadow:0 0 50px #0008}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;gap:10px;align-items:center;padding:12px}.pill{background:#111827e8;border:2px solid #41516d;border-radius:9px;padding:7px 11px;box-shadow:0 4px 0 #070b12;font-weight:700}.task{max-width:52%;color:#fff3b0}.buttons{margin-left:auto;display:flex;gap:8px;pointer-events:auto}.icon{width:42px;height:42px;color:white;background:#202c42;border:2px solid #617391;border-radius:9px;cursor:pointer}.progress{position:absolute;top:62px;left:14px;width:230px;height:12px;border:2px solid #111827;background:#111827;border-radius:6px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#facc15);width:0}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#111827e8;border:2px solid #f5d06f;padding:8px 15px;border-radius:12px;font-weight:800;display:none}.modal{position:absolute;inset:0;background:#050a13c9;display:none;place-items:center;pointer-events:auto;padding:20px}.modal.show{display:grid}.card{width:min(720px,94vw);max-height:86%;overflow:auto;background:#f7eed8;color:#1e293b;border:5px solid #583b26;box-shadow:0 10px 0 #120d08;border-radius:8px;padding:22px}.card h2{margin:0 0 8px;color:#7c2d12}.speaker{color:#047857;font-weight:900}.options{display:grid;gap:9px;margin-top:15px}.options button,.primary{background:#fff;border:3px solid #8b6b46;color:#263238;border-radius:6px;text-align:left;padding:11px 14px;cursor:pointer;font-weight:700}.options button:hover,.primary:hover{background:#fff4b5;transform:translateY(-1px)}.feedback{min-height:28px;margin-top:12px;font-weight:800}.good{color:#087f5b}.soft{color:#9a3412}.primary{background:#1d4ed8;color:#fff;border-color:#0f2b73;text-align:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.report{display:grid;grid-template-columns:1fr 270px;gap:18px}.report canvas{width:270px;height:270px;background:#fff;border-radius:50%}.small{font-size:13px;color:#475569}.teacher{position:absolute;inset:45px;background:#172033f2;border:3px solid #8ca0c4;border-radius:12px;padding:18px;display:none;overflow:auto;pointer-events:auto}.teacher.show{display:block}.teacher table{width:100%;border-collapse:collapse}.teacher td,.teacher th{border:1px solid #60708e;padding:6px}.teacher button{padding:7px;margin:4px;background:#33476b;color:#fff;border:1px solid #91a4c6;border-radius:5px}.joy{position:absolute;left:18px;bottom:20px;width:118px;height:118px;border-radius:50%;background:#33415588;border:3px solid #cbd5e188;display:none;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:#e2e8f0bb;border:3px solid white}.act{position:absolute;right:26px;bottom:38px;width:70px;height:70px;border-radius:50%;background:#f5c84cdd;color:#382b08;border:4px solid #fff;font-weight:900;display:none;pointer-events:auto}@media(pointer:coarse),(max-width:800px){.joy,.act{display:block}.top{padding:6px}.pill{font-size:12px;padding:5px}.task{max-width:55%}.progress{top:48px}.report{grid-template-columns:1fr}.card{padding:14px}}

<body><div id="app"><div id="shell"><canvas id="game" width="960" height="540"></canvas>
<div class="hud"><div class="top"><div class="pill" id="floor">圖書館 1F</div><div class="pill task" id="task"></div><div class="buttons"><button class="icon" id="sound" title="背景音樂">♫</button><button class="icon" id="help" title="操作說明">?</button><button class="icon" id="teach" title="教師模式">⋮</button></div></div><div class="progress"><i id="bar"></i></div><div class="hint" id="hint">E　互動</div></div>

<script>
(()=>{'use strict';
const C=document.querySelector('#game'),x=C.getContext('2d');x.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s), modal=$('#modal'),card=$('#card');
const state={floor:1,task:0,start:Date.now(),answers:[],order:[],visited:new Set(['大門']),music:false,done:false};
const player={x:470,y:500,vx:0,vy:0,speed:155,name:'新生小梅'};const keys={};let last=performance.now(),near=null,bgmTimer=0;
const tasks=['先到大門左側置物櫃寄放書包','到借還書櫃台向呂老師報到','到資訊檢索區完成 OPAC 查書','走樓梯到 2F，依索書號找到書架','回 1F 櫃台完成借書規則挑戰','到事務機器體驗影印與掃描','到雜誌區處理安靜閱讀情境','到梅高特藏區完成畢業測驗'];
const areas1=[['置物櫃',28,424,55,106],['閱讀桌',28,105,55,125],['閱讀桌',28,282,55,130],['討論室',28,22,500,80],['SDGs 專區',120,106,408,30],['閱讀區',125,150,300,75],['雜誌區',125,236,300,60],['曬書桌',125,304,300,84],['新書展示區',240,424,180,60],['展示螢幕',610,22,190,28],['閱讀區',610,55,190,170],['梅高特藏區',845,22,100,185],['資訊檢索區',610,265,330,40],['行政辦公室',610,310,335,160],['借還書櫃台',515,305,100,165],['事務機器',888,205,57,50],['往2F樓梯',785,474,160,56],['大門',420,510,95,30],['公佈欄',85,424,150,12]];
const areas2=[['討論室',20,20,50,78],['閱讀桌',20,105,50,420],['閱讀座位',90,22,780,30],...Array.from({length:10},(_,i)=>['書架 '+(i+1),110+i*75,72,55,165]),['閱讀區',90,265,710,220],['閱讀桌',115,280,280,60],['閱讀桌',445,280,280,60],['閱讀桌',115,360,280,60],['閱讀桌',445,360,280,60],['閱讀桌',115,438,280,45],['閱讀桌',445,438,280,45],['討論室',895,20,50,78],['閱讀桌',895,105,50,250],['儲物室',885,400,65,125],['往1F樓梯',815,390,60,135]];
const interact=[
{n:'置物櫃',f:1,x:56,y:470,task:0,dialog:['入館前準備','書包、袋子、食物與飲料（包含礦泉水）都不可帶入館內。請取出貴重物品並自行保管，再把書包寄放在館外置物櫃。'],q:'下列哪一項可以帶進圖書館？',o:['密封礦泉水','自己的課外書（不帶書包）','手搖飲'],a:1,ok:'答對了！自己的書可以帶入閱讀，但書包與飲食不可入館。',bad:'再想想：礦泉水也屬於飲料；自己的書可以帶入閱讀。'},
{n:'借還書櫃台',f:1,x:560,y:390,task:1,dialog:['呂佳螢老師｜讀者服務','歡迎來到楊梅高中圖書館！我負責圖書、雜誌採購上架、借還書、催書、新書推薦，以及影印、列印與掃描服務。今天請跟著任務卡熟悉館內。'],q:'圖書館上課日的開放時間是？',o:['07:30–17:00','08:00–16:00','08:30–16:45'],a:1,ok:'正確！學生使用時間為上課日 08:00–16:00。',bad:'提示：08:30–16:45 是手冊另列的社區民眾時段，不是學生規定。'},
{n:'資訊檢索區',f:1,x:760,y:285,task:2,dialog:['賴俊帆老師｜資訊媒體組','館藏查詢路徑是「學校首頁 → 圖書館圖書查詢」，可選擇關鍵字、ISBN 等欄位後開始查詢。資訊檢索電腦不可連線不當網頁。'],q:'要找《少年讀史記》，正確的 OPAC 流程是？',o:['學校首頁 → 圖書館圖書查詢 → 選關鍵字 → 輸入書名 → 開始查詢','直接到櫃台猜書架','用社群網站搜尋並隨意翻架'],a:0,ok:'查詢成功！系統顯示索書號 610.9 1122，請到 2F 書架 6。',bad:'請從學校首頁進入圖書館圖書查詢，再選欄位並開始查詢。'},
{n:'書架 6',f:2,x:110+5*75+27,y:150,task:3,dialog:['2F 書庫','2F 上方共有 10 排書架。先用 OPAC 取得索書號，再依架標與索書號順序找書；你已到達模擬任務指定的第 6 架。'],q:'找到書後，要在哪裡完成借書？',o:['直接從 2F 離館','回 1F 讀者服務櫃台','放在閱讀桌就算借閱'],a:1,ok:'正確！請帶書回 1F 櫃台辦理借書。',bad:'文件規定：由 1F 入館、到 2F 找書，再回 1F 櫃台完成借書。'},
{n:'借還書櫃台',f:1,x:560,y:390,task:4,dialog:['呂佳螢老師｜借書挑戰','借書需攜帶學生證，並在開放日 16:00 前完成程序。'],q:'學生借書與續借規定何者正確？',o:['最多 4 本、借期 2 週；到期前 1–2 日可續借 2 週','最多 6 本、借期 30 天','不限本數，到期後再續借'],a:0,ok:'完全正確！逾期天數會累計成暫停借閱權限天數。',bad:'請記住「4 本、2 週、到期前 1–2 日、續借 2 週」。'},
{n:'事務機器',f:1,x:915,y:230,task:5,dialog:['事務機器','影印、列印與掃描皆需自備餘額 10 元以上的悠遊卡。'],q:'下列費用何者正確？',o:['黑白 2 元／頁、彩色 6 元／頁；掃描過卡免費','黑白 1 元／頁、彩色 5 元／頁；掃描 2 元','三項服務都免費'],a:0,ok:'正確！掃描仍需過悠遊卡，但不扣款。',bad:'提示：黑白 2 元、彩色 6 元；掃描只過卡、不收費。'},
{n:'雜誌區',f:1,x:280,y:266,task:6,dialog:['情境事件｜安靜閱讀','你看到同學拿著飲料大聲聊天，還想把當期雜誌帶回家。'],q:'最合適的提醒是？',o:['小聲就能喝，雜誌記得下週還','請把飲料留在館外、降低音量；當期雜誌只能館內閱讀','改用手機聊天就沒問題'],a:1,ok:'溫和提醒做得很好！館內也不得使用手機（教師授課所需除外）。',bad:'圖書館重視安靜與共享：飲食不可入館，當期雜誌不外借。'},
{n:'梅高特藏區',f:1,x:895,y:110,task:7,dialog:['畢業測驗｜梅高特藏','梅高特藏展示《梅岡風》、近幾屆畢業紀念冊與《梅高青年》等校史刊物，不開放外借。'],q:'上課時間想進館查資料，應怎麼做？',o:['帶學生證登記，並取得教師同意','只要安靜就可直接進館','用手機拍訊息當證明即可'],a:0,ok:'畢業測驗通過！你已具備安全、負責、尊重他人的圖書館素養。',bad:'上課時間需攜學生證登記，並獲教師同意；未帶學生證不得留館。'}];
function drawFloor(){x.fillStyle='#17202c';x.fillRect(0,0,960,540);x.fillStyle='#a97748';x.fillRect(14,14,932,512);for(let yy=14;yy<526;yy+=16){x.fillStyle=yy%32?'#ad7c4c':'#a57345';x.fillRect(14,yy,932,15);for(let xx=(yy%32?14:30);xx<946;xx+=64){x.fillStyle='#8c603b';x.fillRect(xx,yy,1,15)}}let ar=state.floor===1?areas1:areas2;ar.forEach(a=>furniture(...a));if(state.floor===1)npc(575,360,'呂老師','#6d28d9');if(state.floor===1)npc(720,325,'賴老師','#0369a1');if(state.floor===1)npc(860,85,'何老師','#047857')}
function furniture(n,px,py,w,h){let shelf=n.startsWith('書架');x.fillStyle=shelf?'#75462d':n.includes('閱讀')?'#d0a663':n.includes('樓梯')?'#687586':n==='行政辦公室'?'#73858f':n==='資訊檢索區'?'#5b7189':n==='梅高特藏區'?'#8a5d78':'#806044';x.fillRect(px,py,w,h);x.fillStyle='#382a22';x.fillRect(px,py,w,4);x.fillRect(px,py+h-4,w,4);if(shelf){for(let yy=py+8;yy<py+h-5;yy+=19){for(let xx=px+5;xx<px+w-4;xx+=7){x.fillStyle=['#c44','#e6b84a','#4776b8','#49996a'][((xx+yy)/7|0)%4];x.fillRect(xx,yy,5,14)}}}else if(n==='資訊檢索區'){for(let xx=px+12;xx<px+w-15;xx+=52){x.fillStyle='#172033';x.fillRect(xx,py+7,34,20);x.fillStyle='#7dd3fc';x.fillRect(xx+4,py+10,26,12)}}else if(n.includes('樓梯')){for(let yy=py+5;yy<py+h;yy+=10){x.fillStyle='#cbd5e1';x.fillRect(px+5,yy,w-10,4)}}label(n,px+w/2,py+h/2)}
function label(t,px,py){x.font='bold 11px Microsoft JhengHei';x.textAlign='center';x.textBaseline='middle';let w=x.measureText(t).width+10;x.fillStyle='#101827cc';x.fillRect(px-w/2,py-9,w,18);x.fillStyle='#fff';x.fillText(t,px,py)}
function npc(px,py,n,c){x.fillStyle=c;x.fillRect(px-8,py-12,16,18);x.fillStyle='#f1c59e';x.fillRect(px-6,py-22,12,11);x.fillStyle='#231815';x.fillRect(px-6,py-22,12,4);label(n,px,py-34)}
function drawPlayer(){let moving=Math.abs(player.vx)+Math.abs(player.vy)>0, bob=moving?Math.sin(performance.now()/80)*2:0;x.fillStyle='#f0c39b';x.fillRect(player.x-7,player.y-18+bob,14,12);x.fillStyle='#2d1a16';x.fillRect(player.x-7,player.y-20+bob,14,5);x.fillStyle='#2563eb';x.fillRect(player.x-9,player.y-7+bob,18,14);x.fillStyle='#172554';x.fillRect(player.x-8,player.y+7+bob,6,8);x.fillRect(player.x+2,player.y+7+bob,6,8);label(player.name,player.x,player.y-34+bob)}
function collision(nx,ny){let ar=state.floor===1?areas1:areas2;return ar.some(a=>{let[n,px,py,w,h]=a;if(n.includes('樓梯')||n==='大門'||n==='公佈欄')return false;let pad=8;return nx>px-pad&&nx<px+w+pad&&ny>py-pad&&ny<py+h+pad})}
function update(dt){if(modal.classList.contains('show')||$('#teacher').classList.contains('show'))return;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);dx+=player.vx;dy+=player.vy;if(dx||dy){let m=Math.hypot(dx,dy);dx/=m;dy/=m;let nx=player.x+dx*player.speed*dt,ny=player.y+dy*player.speed*dt;if(!collision(nx,player.y))player.x=Math.max(18,Math.min(942,nx));if(!collision(player.x,ny))player.y=Math.max(18,Math.min(522,ny));if(Math.random()<.08)sfx('step')}checkStair();near=nearest();$('#hint').style.display=near?'block':'none'}
function checkStair(){if(state.floor===1&&player.x>785&&player.y>474){state.floor=2;player.x=840;player.y=380;state.visited.add('2F書庫');sfx('up')}else if(state.floor===2&&player.x>805&&player.y>380){state.floor=1;player.x=820;player.y=460;sfx('up')}$('#floor').textContent='圖書館 '+state.floor+'F'}
function nearest(){let candidates=interact.filter(i=>i.f===state.floor&&Math.hypot(player.x-i.x,player.y-i.y)<58);let zones=(state.floor===1?areas1:areas2).map(a=>({n:a[0],f:state.floor,x:a[1]+a[3]/2,y:a[2]+a[4]/2,info:true})).filter(i=>Math.hypot(player.x-i.x,player.y-i.y)<55);return candidates[0]||zones[0]||null}
function interactNow(){if(!near)return;if(near.info){state.visited.add(near.n);show(`<h2>${near.n}</h2><p>你已探索這個空間。依配置圖，這裡是圖書館 ${state.floor}F 的「${near.n}」。</p><button class="primary" onclick="closeModal()">繼續探索</button>`);return}state.visited.add(near.n);if(near.task!==state.task){show(`<h2>${near.n}</h2><p>${near.task<state.task?'這個任務已完成。':'請先依任務卡完成前面的步驟。'}</p><button class="primary" onclick="closeModal()">知道了</button>`);return}ask(near)}
function ask(q){show(`<div class="speaker">${q.dialog[0]}</div><p>${q.dialog[1]}</p><h2>${q.q}</h2><div class="options">${q.o.map((o,i)=>`<button onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`)}
window.answer=i=>{let q=interact[state.task],correct=i===q.a;state.answers.push({task:state.task+1,question:q.q,choice:q.o[i],correct,time:Math.round((Date.now()-state.start)/1000)});$('#feedback').className='feedback '+(correct?'good':'soft');$('#feedback').textContent=correct?'✓ '+q.ok:'溫柔提示：'+q.bad;if(correct){[...card.querySelectorAll('.options button')].forEach(b=>b.disabled=true);card.insertAdjacentHTML('beforeend',`<button class="primary" onclick="completeTask()">完成任務</button>`);sfx('good')}else sfx('bad')};
window.completeTask=()=>{state.order.push(state.task+1);state.task++;closeModal();sfx('complete');if(state.task>=tasks.length){state.done=true;setTimeout(report,300)}updateHud()};window.closeModal=()=>modal.classList.remove('show');
function show(h){card.innerHTML=h;modal.classList.add('show')};function updateHud(){$('#task').textContent=state.done?'任務完成：歡迎常來圖書館！':`任務 ${state.task+1}/8｜${tasks[state.task]}`;$('#bar').style.width=(state.task/8*100)+'%'}
function report(){let correct=state.answers.filter(a=>a.correct).length,total=state.answers.length,acc=total?Math.round(correct/total*100):0,expl=Math.min(100,Math.round(state.visited.size/23*100)),mins=Math.floor((Date.now()-state.start)/60000),secs=Math.floor((Date.now()-state.start)/1000)%60,score=Math.round((state.task/8*40)+(acc*.4)+(expl*.2));show(`<h2>新生第一日｜學習成果</h2><div class="report"><div><p><b>圖書館熟悉度：${score} 分</b></p><p>任務完成 ${state.task}/8　｜　答題正確率 ${acc}%<br>探索區域 ${state.visited.size}/23（${expl}%）　｜　總耗時 ${mins}分${secs}秒</p><p class="small">答錯不扣分；系統記錄每次嘗試，讓老師看見學習歷程。</p><div class="grid2"><button class="primary" onclick="copyReport()">複製摘要</button><button class="primary" onclick="downloadCSV()">下載 CSV</button></div></div><canvas id="radar" width="270" height="270"></canvas></div>`);setTimeout(()=>radar([state.task/8*100,acc,expl,Math.max(55,100-Math.abs(420-(Date.now()-state.start)/1000)/8)]),0)}
function radar(v){let c=$('#radar'),g=c.getContext('2d'),cx=135,cy=135,R=92,labels=['任務','知識','探索','效率'];g.clearRect(0,0,270,270);for(let k=1;k<=4;k++){g.beginPath();for(let i=0;i<4;i++){let a=-Math.PI/2+i*Math.PI/2,r=R*k/4;g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}g.closePath();g.strokeStyle='#cbd5e1';g.stroke()}g.beginPath();v.forEach((z,i)=>{let a=-Math.PI/2+i*Math.PI/2,r=R*z/100,gx=cx+Math.cos(a)*r,gy=cy+Math.sin(a)*r;i?g.lineTo(gx,gy):g.moveTo(gx,gy)});g.closePath();g.fillStyle='#38bdf855';g.fill();g.strokeStyle='#0369a1';g.lineWidth=3;g.stroke();g.fillStyle='#334155';g.font='bold 14px Microsoft JhengHei';g.textAlign='center';labels.forEach((t,i)=>{let a=-Math.PI/2+i*Math.PI/2;g.fillText(t,cx+Math.cos(a)*116,cy+Math.sin(a)*116+5)})}
function csv(){let rows=[['任務','題目','作答','正確','作答時間(秒)'],...state.answers.map(a=>[a.task,a.question,a.choice,a.correct?'是':'否',a.time]),[],['完成順序',state.order.join('→')],['探索區域', [...state.visited].join('、')],['總耗時(秒)',Math.round((Date.now()-state.start)/1000)]];return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}
window.downloadCSV=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv'}));a.download='楊梅高中圖書館學習歷程.csv';a.click()};window.copyReport=()=>navigator.clipboard.writeText(`楊梅高中圖書館新生利用教育｜完成 ${state.task}/8｜答對 ${state.answers.filter(a=>a.correct).length}/${state.answers.length}｜探索 ${state.visited.size}/23｜耗時 ${Math.round((Date.now()-state.start)/1000)} 秒`);
function teacher(){let el=$('#teacher');el.innerHTML=`<button onclick="teacherClose()">關閉 ×</button><h2>教師模式</h2><p>關卡直達（會標記前置任務完成）：</p>${tasks.map((t,i)=>`<button onclick="jump(${i})">${i+1}. ${t}</button>`).join('')}<h3>答題統計</h3><p>嘗試 ${state.answers.length} 次；答對 ${state.answers.filter(a=>a.correct).length} 次；探索 ${state.visited.size}/23。</p><h3>教學重點對照</h3><table><tr><th>任務</th><th>重點</th></tr><tr><td>1、7</td><td>物品寄放、安靜、禁飲食與手機</td></tr><tr><td>2、5</td><td>開放時間、借還續借、逾期</td></tr><tr><td>3、4</td><td>OPAC 與索書號尋書動線</td></tr><tr><td>6</td><td>影印／列印／掃描與悠遊卡</td></tr><tr><td>8</td><td>特藏與上課時間入館規範</td></tr></table><button onclick="resetGame()">重置遊戲</button>`;el.classList.add('show')};window.teacherClose=()=>$('#teacher').classList.remove('show');window.jump=i=>{state.task=i;state.order=Array.from({length:i},(_,k)=>k+1);state.floor=interact[i].f;player.x=interact[i].x;player.y=interact[i].y+50;teacherClose();updateHud()};window.resetGame=()=>location.reload();
function sfx(t){let A=audio();if(!A)return;let o=A.createOscillator(),g=A.createGain(),now=A.currentTime;let f={step:90,good:660,bad:180,complete:880,up:420}[t]||300;o.type=t==='bad'?'sawtooth':'square';o.frequency.setValueAtTime(f,now);if(t==='complete')o.frequency.exponentialRampToValueAtTime(1320,now+.18);g.gain.setValueAtTime(t==='step'?.015:.06,now);g.gain.exponentialRampToValueAtTime(.001,now+(t==='step'?.04:.22));o.connect(g).connect(A.destination);o.start();o.stop(now+.25)}let AC=null;function audio(){try{return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}catch(e){return null}}
function music(){state.music=!state.music;$('#sound').style.color=state.music?'#facc15':'white';clearInterval(bgmTimer);if(state.music){let n=0;bgmTimer=setInterval(()=>{let A=audio(),o=A.createOscillator(),g=A.createGain(),now=A.currentTime,notes=[261,329,392,329,293,349,440,349];o.type='triangle';o.frequency.value=notes[n++%notes.length];g.gain.setValueAtTime(.025,now);g.gain.exponentialRampToValueAtTime(.001,now+.7);o.connect(g).connect(A.destination);o.start();o.stop(now+.75)},520)}}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e'||e.key==='Enter')interactNow();if(e.key.toLowerCase()==='t')teacher()});document.addEventListener('keyup',e=>keys[e.key]=false);$('#act').onclick=interactNow;$('#teach').onclick=teacher;$('#sound').onclick=music;$('#help').onclick=()=>show('<h2>操作說明</h2><p>使用 WASD 或方向鍵移動；靠近物件時按 E／Enter 互動。平板可使用左下搖桿與右下 E 鍵。靠近樓梯即可切換樓層。</p><button class="primary" onclick="closeModal()">開始探索</button>');
let joy=$('#joy'),knob=$('#knob');function joyMove(e){let r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),lim=36;if(m>lim){dx*=lim/m;dy*=lim/m}knob.style.transform=`translate(${dx}px,${dy}px)`;player.vx=dx/lim;player.vy=dy/lim}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});joy.addEventListener('pointerup',()=>{player.vx=player.vy=0;knob.style.transform=''})
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t;update(dt);drawFloor();drawPlayer();requestAnimationFrame(loop)}updateHud();requestAnimationFrame(loop);setTimeout(()=>$('#help').click(),500);
})();
